; Faith Runner V settings (step 1: movement only). Lines starting with ; are notes.

; Keyboard key: tap it to switch Faith mode on and off, hold it for half a second for the
; settings menu (0x77 = F8; F7 is World Travel's teleport).
ToggleKey = 0x77
; Controller: click both sticks together (tap: Faith mode, hold: menu). 1 = on, 0 = off.
PadToggle = 1

; Look speed: mouse (bigger = faster) and right stick (radians per second).
MouseSensitivity = 0.12
PadSensitivity = 3.2
; 1 if the camera tilts the wrong way on wallruns.
InvertRoll = 0

; First-person body: faith = Faith's own arms and legs from Mirror's Edge;
; gta = the GTA character you're playing (any character), its own arms and legs moving with
; Faith's first-person animations, its head hidden; none = no body.
Body = gta
; With Body = gta in first person, how the character's head is kept out of view:
;   gta    = Faith's camera as usual; GTA is told it's in its own first-person view, so it may
;            hide the head itself (GTA keeps the head in the shadow that way)
;   gtacam = GTA's own first-person camera does the viewing (no Faith camera bob or tilt)
;   shrink = the head is shrunk to a point (always works; the shadow has no head)
HeadHide = shrink
; Faith's sounds from Mirror's Edge (footsteps, breathing, landings...), with her body: 1 = on.
Sounds = 1
SoundVolume = 1.0
; Volume per kind of sound (times SoundVolume): footsteps, hand grabs, Faith's voice
; (breathing, effort), everything else (wind, landings, slides, whooshes).
FootstepVolume = 0.35
HandVolume = 0.8
VoiceVolume = 1.0
EffectsVolume = 1.0
; Your Mirror's Edge folder (the mod reads Faith's body, animations and sounds from it;
; nothing from the game is copied).
MirrorsEdge = 

; Wallclimbs step out round small overhangs (window sills, trims) up to this deep, in metres,
; instead of stopping under them. 0 = Mirror's Edge's own rule (stop).
OverhangStepOut = 0.45
; Kerbs and clutter she runs straight over, and ledges she steps up onto without a vault (m).
StepHeight = 0.45
StepUp = 0.80
; A fall from this high (m) ends Faith mode with GTA's ragdoll. Mirror's Edge: 10 m.
LethalFall = 20

; How far the GTA character's middle sits above Faith's feet (metres).
PedZOffset = 1.0

; Size of the area of GTA collision read around you (metres each way), and how far you
; move before it is read again.
CollisionRadius = 64
RebuildDistance = 20

; Plain GTA animations shown for each kind of move, as "dictionary, clip". Several can be
; given, separated by |: the first one that loads is used (FaithRunnerV.log says which).
AnimRun = move_m@jogger, run | move_m@generic, run
AnimAir = move_fall, fall_med | skydive@base, free_idle
AnimWall = move_fall, fall_med | skydive@base, free_idle
AnimHang = move_fall, fall_med | skydive@base, free_idle
AnimSlide = move_fall, fall_med | skydive@base, free_idle

; How fast she climbs up ladders, times Mirror's Edge's speed (1.0).
LadderSpeed = 1.6

; The player's character: game (whoever the game gives you), faith (Faith's add-on ped,
; game outfit) or faith2 (prologue outfit). Needs the faithcatalyst add-on pack.
PedModel = game

; A key that opens (or closes) the settings menu with one press, without switching Faith mode.
; For example 0x84 = F21. 0 = none.
MenuKey = 0
