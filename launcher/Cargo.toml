[package]
name = "launcher"
version = "0.1.0"
edition = "2021"
publish = false
description = "Installs and updates the parkour part (own GitHub) and SK8V (becaring's GitHub) for GTA V Legacy"

[[bin]]
name = "Launcher"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
rfd = "0.18"
winreg = "0.56"
sha2 = "0.11"
trash = "5"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "unwind"
